<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100.33 142.39">
  <!-- Símbolo Visitare (porta) — mesmas coordenadas de site/public/favicon.svg,
       para que a aba do PWA e a do site sejam a mesma marca. -->
  <polygon class="frame"
    points="20.73,41.74 20.73,34.23 27.23,30.48 80.02,0 0,0 0,100.33 20.73,100.33 20.73,41.74" />
  <polygon class="door"
    points="100.33,103.94 100.33,3.28 33.73,41.74 33.73,142.39" />
  <style>
    .frame { fill: #83C5BE; }
    .door  { fill: #006D77; }
    /* Tab escuro: porta vira ivory para não sumir no fundo. */
    @media (prefers-color-scheme: dark) {
      .door { fill: #FFFEF1; }
    }
  </style>
</svg>
